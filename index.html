<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Jeda 2 detik agar animasi loading bulatnya sempat berputar indah -->
    <!-- GANTI URL di bawah ini dengan link portofolio kamu -->
    <meta
      http-equiv="refresh"
      content="2; url=https://intera-ashy.vercel.app/"
    />
    <title>Redirecting to Portfolio...</title>

    <style>
      /* Reset & Base Style */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f8fafc; /* Slate 50 */
        color: #334155; /* Slate 700 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }

      /* Container Card */
      .container {
        text-align: center;
        padding: 2.5rem;
        max-width: 400px;
        width: 90%;
      }

      /* Animasi Loading Bulat Besar (Spinner) */
      .spinner {
        width: 70px;
        height: 70px;
        border: 5px solid #e2e8f0; /* Slate 200 (Warna lingkaran dasar) */
        border-top: 5px solid #4f46e5; /* Indigo 600 (Warna putaran loading) */
        border-radius: 50%;
        margin: 0 auto 2rem auto;
        animation: spin 1s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Typography */
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a; /* Slate 900 */
        margin-bottom: 0.5rem;
        letter-spacing: -0.025em;
      }
      p {
        font-size: 0.875rem;
        color: #64748b; /* Slate 500 */
        line-height: 1.5;
      }

      /* Tautan Manual */
      .manual-link {
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: #4f46e5;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }
      .manual-link:hover {
        color: #3730a3;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Bulatan Loading Besar -->
      <div class="spinner"></div>

      <!-- Pesan Teks -->
      <h1>Menuju Intera App</h1>
      <p>Mohon tunggu sebentar, halaman sedang dialihkan secara otomatis...</p>

      <!-- Cadangan jika redirect macet -->
      <!-- JANGAN LUPA GANTI href di bawah ini dengan link portofolio kamu juga -->
      <a href="https://intera-ashy.vercel.app/" class="manual-link">
        Klik di sini jika kamu tidak dialihkan otomatis
      </a>
    </div>
  </body>
</html>
